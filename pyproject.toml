[project]
name = "shopping-decision-agent"
version = "0.1.0"
description = "Independent local laptop shopping decision agent with synthetic data"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115", "uvicorn>=0.34", "pydantic>=2.10", "httpx>=0.28",
  "langgraph==1.2.5", "langsmith==0.14.17", "typer>=0.15",
]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.9", "build>=1.2"]

[project.scripts]
shopping-advisor = "shopping_advisor.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shopping_advisor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["shopping_advisor"]
